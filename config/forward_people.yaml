# Branch supervisors whose calls we can check (spec 2026-11-16-priority-no-followup, part 4 + the forward chain).
# Every employee of the customer-service system can be chosen (synced from it); this list only adds each
# supervisor's PBX ext: his calls to the customer are the proof of solving (only supervisors are checked).
# guid = the person's id there (forward-targets); filled by the sync, matched by name (+ branch).
people:
  - {branch: "فرع الزهور",            name: "صالح الغامدي",        ext: "101", guid: null}
  - {branch: "حفر الباطن مصيف",        name: "اسماعيل ابو المعاطي",  ext: "301", guid: null}
  - {branch: "حفر الباطن حي الواحه",    name: "السيد عبدالمنعم",      ext: "401", guid: null}
  - {branch: "الرياض الحمرا",          name: "عمر جنينة",           ext: "201", guid: null}
  - {branch: "المدينة المنورة",         name: "شريف",                ext: "501", guid: null}
  - {branch: "خميس مشيط الظرفة",       name: "عبدالعظيم",           ext: "601", guid: null}
  - {branch: "الرياض ظهرة لبن",        name: "عماد حلمي",           ext: "901", guid: null}

# The forward chain's last level (user 2026-11-16): the 3 managers. ALL of them get a problem that neither the
# employee nor his branch supervisor solved in 24 h each (the first on the same ticket, the others a copy ticket).
# name = as written in the customer-service system (matched by name words; add branch or guid if two people match).
# Their calls are not checked: their close counts as solved.
managers:
  - {name: "حسام تغيان"}
  - {name: "عماد النمر"}
  - {name: "احمد حطب"}
# مروان حسني sees every forward on the forwards page (a supervisor login), gets no tickets (user 2026-11-16).

# Rules for call flags and silence metrics (spec 2026-11-14-call-analysis, decisions 10 + 11). No LLM involved.
# WORD LISTS (bad_words, escalation, competitor, competitor_rule own / ignore_next) are now edited on the web page
# "القواعد" (spec 2026-11-17-rules-editor). This file only filled the database once (migration 0023); after that the
# database wins and editing the lists here changes nothing. silence, analysis and competitor_rule word/label still
# apply from this file. Re-check old calls on the page, or: python -m callsight flags --recompute
#
# Phrases are matched as whole words on the normalised transcript (same normalisation as the word search:
# hamza/alif forms, ة/ه and ى/ي are folded). Only kept windows are searched (silence/hallucination windows never).
# Every flag means "needs listening": dialect, negation ("ما ابي المدير") and ASR errors give false hits.
# Recommended starter lists (written 2026-11-15 on the manager's request; the manager can add or remove lines).
# The recording has both voices on one channel, so a hit does not say WHO spoke (agent or customer).
flags:
  bad_words:
    - غبي
    - غبية
    - يا غبي
    - حمار
    - يا حمار
    - حيوان
    - يا حيوان
    - كلب
    - يا كلب
    - تافه
    - تافهة
    - وقح
    - وقحة
    - حقير
    - حقيرة
    - سافل
    - واطي
    - قليل ادب
    - قليل الادب
    - قليلة ادب
    - قليلة الادب
    - ما تستحي
    - ما تستحين
    - اخرس
    - اخرسي
    - انطم
    - انطمي
    - انقلع
    - انقلعي
    - كل تبن
    - كلي تبن
    - زفت
    - يلعن
    - الله يلعنك
    - الله ياخذك
    - متخلف
    - متخلفة
    - مجنون انت
  escalation:
    # asks for a manager
    - ابي المدير
    - ابغى المدير
    - ابي اكلم المدير
    - ابغى اكلم المدير
    - عطني المدير
    - عطوني المدير
    - وين المدير
    - حولني للمدير
    - حولني على المدير
    - ابي المسؤول
    - ابغى المسؤول
    - ابي اكلم المسؤول
    - مين المسؤول
    # complaint / official body
    - بشتكي
    - بشتكي عليكم
    - راح اشتكي
    - بقدم شكوى
    - برفع شكوى
    - ارفع شكوى
    - شكوى رسمية
    - وزارة التجارة
    - حماية المستهلك
    - برفع بلاغ
    - برفع قضية
    - ارفع قضية
    - المحكمة
    - محامي
    # money back / leaving
    - ابي فلوسي
    - ابغى فلوسي
    - رجعوا فلوسي
    - رجع فلوسي
    - استرجاع المبلغ
    - استرداد المبلغ
    - ابي الغي
    - ابغى الغي
    - الغاء التسجيل
    - ابي انسحب
    - ابغى انسحب
    - بنسحب
    # strong anger / threat to publish
    - نصابين
    - نصب واحتيال
    - حرامية
    - كذابين
    - بفضحكم
    - بنشر في تويتر
    - خدمة سيئة
    - اسوا خدمة
    - اسوا معهد
    - ما راح اتعامل معكم
    - اخر مرة اتعامل
  competitor:
    - معاهد ثانية
    - معاهد اخرى
    - معهد ثاني
    - معهد اخر
    - معهد كذا
    - معهد غير

# Competitor by pattern: "معهد" / "المعهد" / "للمعهد" ... + a next word that starts with ال and is not ours
# (e.g. "معهد الخليج", "المعهد البريطاني"). "المعهد" + a normal word ("المعهد يفتح") usually means us: no flag.
# A competitor whose name has no ال goes in the `competitor` list above. `own` = next words that mean us;
# `ignore_next` = next words that are not a name. `label` is what the call page shows for the hit.
competitor_rule:
  word: معهد
  own:
    - السعودي
  ignore_next:
    - اللي
    - الي
    - اليوم
    - الان
    - الحين
    - الله
    - الساعة
    - الاسبوع
    - الشهر
    - السنة
    - الصبح
    - العصر
    - المغرب
    - الليل
    - الفترة
    - الاحد
    - الاثنين
    - الثلاثاء
    - الاربعاء
    - الخميس
    - الجمعة
    - السبت
    - المرة
    - الدورة
    - الدورات
    - الرسوم
    - المبلغ
    - الفلوس
    - الموقع
    - الرقم
    - الشهادة
  label: معهد غير المعهد السعودي

# Silence metrics from the recording (RMS per frame, no diarization). Hold music is NOT silence.
silence:
  threshold_dbfs: -40        # frame quieter than this = silent
  frame_ms: 50
  min_silence_s: 2           # shorter pauses are normal speech gaps
  long_silence_s: 10         # "hold-like" silence

# A call whose transcript lost more than this share of its duration to dropped windows is not analysed (skipped).
analysis:
  max_dropped_share: 0.30

# One-off jobs on the AWS main server, started by hand: Actions -> Server task -> Run workflow.
# Runs on the runner installed ON the main server. A new password is printed in this run's log:
# copy it, then delete the run (the repository must stay PRIVATE).
name: Server task

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        options:
          - make-supervisor
          - new-admin-password
          - new-supervisor-password
          - live-on
          - live-off
          - live-log
          - sync-agents
          - rating-fetch
          - rating-create
          - rating-status
      value:
        description: "rating-fetch / rating-create: days YYYY-MM-DD,YYYY-MM-DD,... (rating-create: then ;N, default 500)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  task:
    runs-on: [self-hosted, callsight-main]
    timeout-minutes: ${{ startsWith(inputs.task, 'rating-') && 90 || 10 }}   # rating-create downloads 500 recordings
    steps:
      - name: Run the task
        working-directory: /opt/callsight
        env:
          TASK: ${{ inputs.task }}
          VALUE: ${{ inputs.value }}
        run: |
          set -euo pipefail
          C=(docker compose -f docker-compose.yml -f deploy/aws/compose.main.yml)
          case "$TASK" in
            make-supervisor)         "${C[@]}" exec -T api python -m callsight create-user supervisor --role supervisor --ext 114 --generate ;;
            new-admin-password)      "${C[@]}" exec -T api python -m callsight set-password admin --generate ;;
            new-supervisor-password) "${C[@]}" exec -T api python -m callsight set-password supervisor --generate ;;
            live-on)
              grep -q '^LIVE_ENABLED=' .env && sed -i 's/^LIVE_ENABLED=.*/LIVE_ENABLED=true/' .env || echo 'LIVE_ENABLED=true' >> .env
              "${C[@]}" up -d api
              "${C[@]}" --profile live up -d --build live
              sleep 45; "${C[@]}" --profile live logs --tail 40 live ;;
            live-off)
              sed -i 's/^LIVE_ENABLED=.*/LIVE_ENABLED=false/' .env
              "${C[@]}" --profile live stop live; "${C[@]}" up -d api ;;
            live-log) "${C[@]}" --profile live logs --tail 60 live ;;
            sync-agents) "${C[@]}" exec -T worker python -m callsight sync-agents ;;
            rating-fetch|rating-create)
              [[ "$VALUE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(,[0-9]{4}-[0-9]{2}-[0-9]{2}){0,30}(\;[0-9]{1,4})?$ ]] || { echo "value must be YYYY-MM-DD,YYYY-MM-DD[;N] (at most 31 days)"; exit 1; }
              DAYS="${VALUE%%;*}"; N=500; [[ "$VALUE" == *";"* ]] && N="${VALUE##*;}"
              if [ "$TASK" = rating-fetch ]; then
                "${C[@]}" exec -T worker python -m callsight rating-set fetch --days "$DAYS"
              else
                "${C[@]}" exec -T worker python -m callsight rating-set create --days "$DAYS" --n "$N"
              fi ;;
            rating-status)
              "${C[@]}" exec -T worker python -m callsight rating-set status
              "${C[@]}" exec -T worker python -m callsight blindset status
              grep -E '^NLP_ENABLED=' .env || echo "NLP_ENABLED not set (off)"
              "${C[@]}" exec -T worker python -m callsight gpu-work || true ;;
          esac

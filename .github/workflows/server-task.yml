# One-off jobs on the AWS main server, started by hand: Actions -> Server task -> Run workflow.
# Runs on the runner installed ON the main server. A new password is printed in this run's log:
# copy it, then delete the run (the repository must stay PRIVATE).
# One runner on the main server: jobs of all workflows run one at a time (never at the same moment). GitHub keeps
# only ONE waiting run per concurrency group: starting a second one while one waits cancels the waiting one, so
# check that every run you started really finished.
name: Server task

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        options:
          - make-supervisor
          - new-admin-password
          - new-supervisor-password
          - live-on
          - live-off
          - live-log
          - sync-agents
          - rating-fetch
          - rating-create
          - rating-status
          - link-keys
          - forward-sync
          - retention-check
          - retention-on
          - retention-off
      value:
        description: "rating-fetch / rating-create: days YYYY-MM-DD,YYYY-MM-DD,... (rating-create: then ;N, default 500)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  task:
    runs-on: [self-hosted, callsight-main]
    timeout-minutes: ${{ startsWith(inputs.task, 'rating-') && 90 || startsWith(inputs.task, 'retention-') && 120 || 10 }}   # rating-create downloads 500 recordings; retention-check saves KPI numbers
    steps:
      - name: Run the task
        working-directory: /opt/callsight
        env:
          TASK: ${{ inputs.task }}
          VALUE: ${{ inputs.value }}
          # link-keys only: set as repository secrets for one run, deleted right after. Never printed.
          K_CS_API_KEY: ${{ inputs.task == 'link-keys' && secrets.CS_API_KEY || '' }}
          K_CS_USER_GUID: ${{ inputs.task == 'link-keys' && secrets.CS_USER_GUID || '' }}
          K_TRAINING_API_KEY: ${{ inputs.task == 'link-keys' && secrets.TRAINING_API_KEY || '' }}
        run: |
          set -euo pipefail
          C=(docker compose -f docker-compose.yml -f deploy/aws/compose.main.yml)
          case "$TASK" in
            make-supervisor)         "${C[@]}" exec -T api python -m callsight create-user supervisor --role supervisor --ext 114 --generate ;;
            new-admin-password)      "${C[@]}" exec -T api python -m callsight set-password admin --generate ;;
            new-supervisor-password) "${C[@]}" exec -T api python -m callsight set-password supervisor --generate ;;
            live-on)
              grep -q '^LIVE_ENABLED=' .env && sed -i 's/^LIVE_ENABLED=.*/LIVE_ENABLED=true/' .env || echo 'LIVE_ENABLED=true' >> .env
              "${C[@]}" up -d api
              "${C[@]}" --profile live up -d --build live
              sleep 45; "${C[@]}" --profile live logs --tail 40 live ;;
            live-off)
              sed -i 's/^LIVE_ENABLED=.*/LIVE_ENABLED=false/' .env
              "${C[@]}" --profile live stop live; "${C[@]}" up -d api ;;
            live-log) "${C[@]}" --profile live logs --tail 60 live ;;
            retention-check)      # PDPL: counts only, deletes nothing (dry run); saves the old periods' KPI numbers
              # the first one saves many weeks' / months' numbers: can take long. A run cut by the timeout keeps working
              # inside the container (holds the maintenance lock): wait, then run again.
              "${C[@]}" exec -T -e RETENTION_ENABLED=true worker python -m callsight retention --dry-run
              grep -E '^RETENTION_ENABLED=' .env || echo "RETENTION_ENABLED not set (off)" ;;
            retention-on|retention-off)   # on: after the user checked retention-check; the next night (04:30) deletes
              V=$([ "$TASK" = retention-on ] && echo true || echo false)
              grep -q '^RETENTION_ENABLED=' .env && sed -i "s/^RETENTION_ENABLED=.*/RETENTION_ENABLED=$V/" .env || echo "RETENTION_ENABLED=$V" >> .env
              "${C[@]}" up -d --force-recreate worker      # only the worker reads it (nightly job + CLI)
              grep -E '^RETENTION_ENABLED=' .env ;;
            sync-agents) "${C[@]}" exec -T worker python -m callsight sync-agents ;;
            rating-fetch|rating-create)
              [[ "$VALUE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(,[0-9]{4}-[0-9]{2}-[0-9]{2}){0,30}(\;[0-9]{1,4})?$ ]] || { echo "value must be YYYY-MM-DD,YYYY-MM-DD[;N] (at most 31 days)"; exit 1; }
              DAYS="${VALUE%%;*}"; N=500; [[ "$VALUE" == *";"* ]] && N="${VALUE##*;}"
              if [ "$TASK" = rating-fetch ]; then
                "${C[@]}" exec -T worker python -m callsight rating-set fetch --days "$DAYS"
              else
                "${C[@]}" exec -T worker python -m callsight rating-set create --days "$DAYS" --n "$N"
              fi ;;
            rating-status)
              "${C[@]}" exec -T worker python -m callsight rating-set status
              "${C[@]}" exec -T worker python -m callsight blindset status
              grep -E '^NLP_ENABLED=' .env || echo "NLP_ENABLED not set (off)"
              "${C[@]}" exec -T worker python -m callsight gpu-work || true ;;
            link-keys)
              # Writes the customer-service + training API keys into the server .env (replaces old lines).
              umask 077
              install -d -m 700 "$HOME/env-backups"            # outside /opt/callsight: the deploy rsync deletes extra files
              cp -p .env "$HOME/env-backups/.env.before-link-keys.$(date +%Y%m%d-%H%M%S)"
              BEFORE=$(wc -l < .env)
              for NAME in CS_API_KEY CS_USER_GUID TRAINING_API_KEY; do
                VAR="K_$NAME"; VAL="${!VAR}"
                if [ -z "$VAL" ]; then echo "$NAME: no secret given, left as it was"; continue; fi
                grep -v "^$NAME=" .env > .env.new || true
                printf '%s=%s\n' "$NAME" "$VAL" >> .env.new
                [ "$(wc -l < .env.new)" -ge "$((BEFORE - 3))" ] || { echo "stop: the new .env looks too short, nothing changed"; rm -f .env.new; exit 1; }
                cat .env.new > .env; rm -f .env.new
                echo "$NAME: set (${#VAL} characters)"
              done
              "${C[@]}" up -d --force-recreate api worker beat
              echo "api, worker, beat restarted" ;;
            forward-sync) "${C[@]}" exec -T worker python -m callsight forward-sync ;;
          esac

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>$title</title>
<style>
@font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 400; src: url("IBMPlexSansArabic-Regular.ttf"); }
@font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 700; src: url("IBMPlexSansArabic-Bold.ttf"); }
@page {
  size: A4; margin: 16mm 14mm 18mm;
  @bottom-center { content: "CallSight · " counter(page) " / " counter(pages); font: 8pt "IBM Plex Sans Arabic"; color: #687083; }
}
* { box-sizing: border-box; }
body { font-family: "IBM Plex Sans Arabic", sans-serif; font-size: 9.5pt; color: #1d2433; direction: rtl; line-height: 1.5; }
h1 { font-size: 20pt; margin: 0 0 4mm; }
h2 { font-size: 13pt; margin: 7mm 0 3mm; border-bottom: 1px solid #e3e6ec; padding-bottom: 1mm; }
h3 { font-size: 11pt; margin: 4mm 0 2mm; }
.muted { color: #687083; }
.cover { border: 1px solid #e3e6ec; border-radius: 3mm; padding: 6mm; margin-bottom: 4mm; }
.cover p { margin: 1mm 0; }
.tag { display: inline-block; background: #fdf0e1; color: #a4570a; border-radius: 2mm; padding: 0 2mm; font-size: 9pt; }
.banner { background: #fbe7e6; color: #b3261e; border-radius: 2mm; padding: 2.5mm 4mm; margin: 3mm 0; font-weight: 700; }
table { width: 100%; border-collapse: collapse; margin: 2mm 0; }
th, td { text-align: right; padding: 1.6mm 2mm; border-bottom: 1px solid #e3e6ec; vertical-align: middle; }
th { background: #f6f7f9; color: #687083; font-weight: 700; font-size: 8.5pt; }
td.n, th.n { text-align: left; }
.up { color: #1e7a46; } .down { color: #b3261e; }
.tiles { margin: 2mm 0; }
.tile { display: inline-block; border: 1px solid #e3e6ec; border-radius: 2mm; padding: 2.5mm 3mm; width: 42mm;
        margin: 0 0 3mm 3mm; vertical-align: top; }
.tile .v { font-size: 14pt; font-weight: 700; }
.tile .l { font-size: 8pt; color: #687083; }
.agent { page-break-before: always; }
.chart { margin: 2mm 0; }
.legend span { display: inline-block; width: 3mm; height: 3mm; margin: 0 1mm; vertical-align: middle; }
.notes { font-size: 8pt; color: #687083; margin-top: 6mm; }
.notes li { margin-bottom: 1mm; }
</style>
</head>
<body>
$body
</body>
</html>

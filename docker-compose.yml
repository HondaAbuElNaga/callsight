# Dev stack on the analytics PC (later: the server). Start: docker compose up -d --build
name: callsight

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://callsight:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/callsight
    REDIS_URL: redis://redis:6379/0
    AUDIO_DIR: /data/audio
    REPORTS_DIR: /data/reports
    TEAMS_FILE: /app/config/teams.yaml
  volumes:
    - ${AUDIO_HOST_DIR:-./data/audio}:/data/audio
    - ${REPORTS_HOST_DIR:-./data/reports}:/data/reports   # archived weekly/monthly PDFs
    - ./config:/app/config:ro
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: callsight
      POSTGRES_USER: callsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"     # this PC only, for the CLI and tests
    networks: [default, asr-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callsight -d callsight"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [default, asr-internal]

  worker:
    <<: *app
    # maint = nightly backup (01:30) + retention; concurrency 1, so they never overlap ingest work on this worker.
    # Backup by hand / before every migration:  docker compose run --rm worker python -m callsight backup
    command: sh -c "alembic upgrade head && celery -A callsight.jobs worker -Q ingest,reports,maint --concurrency=1 -l info"
    environment:
      DATABASE_URL: postgresql+psycopg://callsight:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/callsight
      REDIS_URL: redis://redis:6379/0
      AUDIO_DIR: /data/audio
      REPORTS_DIR: /data/reports
      TEAMS_FILE: /app/config/teams.yaml
      BACKUP_DIR: /backup
    volumes:
      - ${AUDIO_HOST_DIR:-./data/audio}:/data/audio
      - ${REPORTS_HOST_DIR:-./data/reports}:/data/reports
      - ./config:/app/config:ro
      - ${BACKUP_HOST_DIR:-./data/backup}:/backup        # DB dumps + copies of recordings/reports (not encrypted)
    healthcheck:
      test: ["CMD-SHELL", "celery -A callsight.jobs inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  api:
    <<: *app
    command: uvicorn callsight.api.main:app --host 0.0.0.0 --port 8080 --no-server-header --no-access-log   # access log would hold searched phone numbers
    volumes:
      - ${AUDIO_HOST_DIR:-./data/audio}:/data/audio
      - ${REPORTS_HOST_DIR:-./data/reports}:/data/reports
      - ./config:/app/config:ro
      - ${BACKUP_HOST_DIR:-./data/backup}:/backup:ro     # health page: free space of the backup disk only
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"   # this PC only (spec decision 2)
    depends_on:
      worker: { condition: service_healthy }   # worker runs the DB migrations first
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  beat:
    <<: *app
    command: celery -A callsight.jobs beat -l info --schedule /tmp/celerybeat-schedule

  # Speech-to-text benchmark on the GPU. Not started by "up -d"; run one model at a time:
  #   docker compose run --rm asr-bench --check
  #   docker compose run --rm asr-bench --model whisper-large-v3 --limit 1
  asr-bench:
    profiles: ["bench"]
    build:
      context: .
      dockerfile: docker/asr-bench/Dockerfile
    environment:
      AUDIO_DIR: /data/audio
      BENCH_OUT: /out
      HF_HUB_OFFLINE: "1"
    network_mode: none                     # real call audio is mounted: no network at all (models come from the cache)
    volumes:
      - ${AUDIO_HOST_DIR:-./data/audio}/goldset:/data/audio/goldset:ro   # read-only: the bench never changes clips
      - ./data/asr-bench:/out
      - hf-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Same runner, separate image: Jais-ASR needs transformers 5, qwen-asr (Audar) pins 4.57.
  #   docker compose run --rm asr-bench-jais --model jais-asr-4bit --limit 1
  asr-bench-jais:
    profiles: ["bench"]
    build:
      context: .
      dockerfile: docker/asr-bench/Dockerfile
      args:
        REQS: requirements-jais.txt
        TORCH_REQS: requirements-jais-torch.txt
    environment:
      AUDIO_DIR: /data/audio
      BENCH_OUT: /out
      HF_HUB_OFFLINE: "1"
    network_mode: none                     # real call audio is mounted: no network at all (models come from the cache)
    volumes:
      - ${AUDIO_HOST_DIR:-./data/audio}/goldset:/data/audio/goldset:ro
      - ./data/asr-bench:/out
      - hf-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Download a model into the cache. Network ON, but NO call audio mounted. Only needed for a new model/revision:
  #   docker compose run --rm asr-bench-download openai/whisper-large-v3 --revision <sha>
  asr-bench-download:
    profiles: ["bench"]
    image: callsight-asr-bench
    entrypoint: ["hf", "download"]
    environment:
      HF_HOME: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - hf-models:/models

  # Speech-to-text worker (spec 2026-11-14-transcription). Not started by "up -d"; start with:
  #   docker compose --profile asr up -d asr-worker
  # ASR_MODEL must match the image: whisper-large-v3 (default, MIT) or audar-asr-turbo here, jais-asr-4bit only in
  # asr-worker-jais. Only ONE asr worker may run (8 GB GPU). Only on the internal network: no internet, no PBX.
  asr-worker:
    profiles: ["asr"]
    build:
      context: .
      dockerfile: docker/asr-worker/Dockerfile
    # No env_file: the worker gets only what it needs (no PBX secret, no APP_SECRET). Values come from .env.
    environment: &asr-env
      DATABASE_URL: postgresql+psycopg://callsight:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/callsight
      REDIS_URL: redis://redis:6379/0
      AUDIO_DIR: /data/audio
      TEAMS_FILE: /app/config/teams.yaml
      ASR_MODEL: ${ASR_MODEL:-whisper-large-v3}
      ASR_START_DATE: ${ASR_START_DATE:-}
      ASR_MIN_TALK: ${ASR_MIN_TALK:-5}
      ASR_MAX_SECONDS: ${ASR_MAX_SECONDS:-3600}
      ASR_BATCH: ${ASR_BATCH:-50}
      ASR_IDLE_UNLOAD_S: ${ASR_IDLE_UNLOAD_S:-300}
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"                  # models come from the cache filled by asr-bench-download
    networks: [asr-internal]
    volumes:
      - ${AUDIO_HOST_DIR:-./data/audio}:/data/audio:ro   # read-only: the worker never changes recordings
      - ./config:/app/config:ro
      - hf-models:/models:ro               # read-only: the worker never downloads or changes models
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Jais-ASR (transformers 5). SERVER ONLY: 11 GB peak GPU memory, does not fit this PC's 8 GB; untested here.
  #   docker compose --profile asr-jais up -d asr-worker-jais     (stop asr-worker first)
  asr-worker-jais:
    profiles: ["asr-jais"]
    build:
      context: .
      dockerfile: docker/asr-worker/Dockerfile
      args:
        REQS: requirements-jais.txt
        TORCH_REQS: requirements-jais-torch.txt
    environment:
      <<: *asr-env
      ASR_MODEL: jais-asr-4bit
      HF_MODULES_CACHE: /tmp/hf-modules    # its remote code is copied here at load; /models is read-only
    networks: [asr-internal]
    volumes:
      - ${AUDIO_HOST_DIR:-./data/audio}:/data/audio:ro
      - ./config:/app/config:ro
      - hf-models:/models:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Local LLM for call analysis (spec 2026-11-14-call-analysis). Not started by "up -d"; start with:
  #   docker compose --profile llm up -d ollama nlp-worker        (and NLP_ENABLED=true in .env for automatic runs)
  # Only on the internal network (no internet): prompts and transcripts never leave this PC. keep_alive 0 = the model
  # leaves the 8 GB GPU right after each answer (shared with the asr worker; a Redis "gpu" lock keeps them apart).
  # OLLAMA_DEBUG stays off: Ollama then does not log prompts.
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    environment:
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_DEBUG: "0"
      OLLAMA_NO_CLOUD: "1"                 # no cloud models: every prompt stays on this PC
    networks: [asr-internal]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Download an LLM into the models volume. Network ON, but NO call data mounted and no GPU. Pin the tag:
  #   docker compose --profile llm-pull run --rm ollama-pull qwen2.5:7b
  ollama-pull:
    profiles: ["llm-pull"]
    image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    entrypoint: ["/bin/sh", "-c", "ollama serve >/dev/null 2>&1 & sleep 3 && ollama pull \"$$0\" && ollama list"]
    command: ["qwen2.5:7b"]
    networks: [default]
    volumes:
      - ollama-models:/root/.ollama

  # Celery worker for queue `nlp` (call analysis): normal app image, HTTP to Ollama only (no torch). Internal network
  # only: it reaches postgres, redis and ollama, nothing else. Reads recordings (silence metrics) read-only.
  nlp-worker:
    profiles: ["llm"]
    build: .
    command: celery -A callsight.analysis.tasks worker -Q nlp --concurrency=1 --prefetch-multiplier=1 -n nlp@%h -l info
    # No env_file: no PBX secret, no APP_SECRET. Values come from .env.
    environment:
      DATABASE_URL: postgresql+psycopg://callsight:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/callsight
      REDIS_URL: redis://redis:6379/0
      AUDIO_DIR: /data/audio
      TEAMS_FILE: /app/config/teams.yaml
      ASR_MODEL: ${ASR_MODEL:-whisper-large-v3}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      OLLAMA_URL: http://ollama:11434
      NLP_ENABLED: ${NLP_ENABLED:-false}
    networks: [asr-internal]
    volumes:
      - ${AUDIO_HOST_DIR:-./data/audio}:/data/audio:ro
      - ./config:/app/config:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ollama: { condition: service_started }
    restart: unless-stopped

networks:
  asr-internal:
    internal: true                         # no route to the internet: call audio + transcripts stay on this PC

volumes:
  pgdata:
  hf-models:
  ollama-models:                           # LLM weights (qwen2.5:7b ~4.7 GB, qwen3:8b ~5.2 GB)

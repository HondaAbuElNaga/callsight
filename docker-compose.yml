# Dev stack on the analytics PC (later: the server). Start: docker compose up -d --build
name: callsight

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://callsight:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/callsight
    REDIS_URL: redis://redis:6379/0
    AUDIO_DIR: /data/audio
    TEAMS_FILE: /app/config/teams.yaml
  volumes:
    - ${AUDIO_HOST_DIR:-./data/audio}:/data/audio
    - ./config:/app/config:ro
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: callsight
      POSTGRES_USER: callsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"     # this PC only, for the CLI and tests
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callsight -d callsight"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    <<: *app
    command: sh -c "alembic upgrade head && celery -A callsight.jobs worker -Q ingest --concurrency=1 -l info"
    healthcheck:
      test: ["CMD-SHELL", "celery -A callsight.jobs inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  api:
    <<: *app
    command: uvicorn callsight.api.main:app --host 0.0.0.0 --port 8080 --no-server-header --no-access-log   # access log would hold searched phone numbers
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"   # this PC only (spec decision 2)
    depends_on:
      worker: { condition: service_healthy }   # worker runs the DB migrations first
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  beat:
    <<: *app
    command: celery -A callsight.jobs beat -l info --schedule /tmp/celerybeat-schedule

  # Speech-to-text benchmark on the GPU. Not started by "up -d"; run one model at a time:
  #   docker compose run --rm asr-bench --check
  #   docker compose run --rm asr-bench --model whisper-large-v3 --limit 1
  asr-bench:
    profiles: ["bench"]
    build:
      context: .
      dockerfile: docker/asr-bench/Dockerfile
    environment:
      AUDIO_DIR: /data/audio
      BENCH_OUT: /out
      HF_HUB_OFFLINE: "1"
    network_mode: none                     # real call audio is mounted: no network at all (models come from the cache)
    volumes:
      - ${AUDIO_HOST_DIR:-./data/audio}/goldset:/data/audio/goldset:ro   # read-only: the bench never changes clips
      - ./data/asr-bench:/out
      - hf-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Same runner, separate image: Jais-ASR needs transformers 5, qwen-asr (Audar) pins 4.57.
  #   docker compose run --rm asr-bench-jais --model jais-asr-4bit --limit 1
  asr-bench-jais:
    profiles: ["bench"]
    build:
      context: .
      dockerfile: docker/asr-bench/Dockerfile
      args:
        REQS: requirements-jais.txt
        TORCH_REQS: requirements-jais-torch.txt
    environment:
      AUDIO_DIR: /data/audio
      BENCH_OUT: /out
      HF_HUB_OFFLINE: "1"
    network_mode: none                     # real call audio is mounted: no network at all (models come from the cache)
    volumes:
      - ${AUDIO_HOST_DIR:-./data/audio}/goldset:/data/audio/goldset:ro
      - ./data/asr-bench:/out
      - hf-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Download a model into the cache. Network ON, but NO call audio mounted. Only needed for a new model/revision:
  #   docker compose run --rm asr-bench-download openai/whisper-large-v3 --revision <sha>
  asr-bench-download:
    profiles: ["bench"]
    image: callsight-asr-bench
    entrypoint: ["hf", "download"]
    environment:
      HF_HOME: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - hf-models:/models

volumes:
  pgdata:
  hf-models:
